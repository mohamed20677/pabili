name: Build Pabili APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Validate Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "URL length: ${#SUPABASE_URL}"
          echo "KEY length: ${#SUPABASE_ANON_KEY}"
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: Secrets SUPABASE_URL or SUPABASE_ANON_KEY are empty"
            exit 1
          fi
          case "$SUPABASE_URL" in
            *PASTE*) echo "ERROR: SUPABASE_URL still has PASTE"; exit 1 ;;
            https://*) ;;
            *) echo "ERROR: must start with https://"; exit 1 ;;
          esac
          case "$SUPABASE_ANON_KEY" in
            *PASTE*) echo "ERROR: SUPABASE_ANON_KEY still has PASTE"; exit 1 ;;
            eyJ*) ;;
            *) echo "ERROR: must start with eyJ (JWT)"; exit 1 ;;
          esac
          echo "Both secrets validated OK"

      - name: Generate icons if missing
        run: |
          mkdir -p assets
          pip install --quiet pillow
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw, ImageFont
          import os
          def make_icon(path, size, bg='#0E7C5B', fg='white'):
              img = Image.new('RGBA', (size, size), bg)
              d = ImageDraw.Draw(img)
              d.ellipse([size*0.22, size*0.22, size*0.78, size*0.78], fill=fg)
              try:
                  font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', int(size*0.45))
              except Exception:
                  font = ImageFont.load_default()
              d.text((size//2, size//2), 'P', fill=bg, anchor='mm', font=font)
              img.save(path)
          if not os.path.exists('assets/icon.png'):
              make_icon('assets/icon.png', 1024)
          if not os.path.exists('assets/adaptive-icon.png'):
              make_icon('assets/adaptive-icon.png', 1024)
          if not os.path.exists('assets/splash.png'):
              img = Image.new('RGB', (1242, 2436), '#0E7C5B')
              d = ImageDraw.Draw(img)
              try:
                  font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 600)
              except Exception:
                  font = ImageFont.load_default()
              d.text((621, 1218), 'P', fill='white', anchor='mm', font=font)
              img.save('/home/user/pabili-app/assets/splash.png')
          if not os.path.exists('assets/notification-icon.png'):
              make_icon('assets/notification-icon.png', 96)
          if not os.path.exists('assets/favicon.png'):
              make_icon('assets/favicon.png', 48)
          PYEOF

      - name: Strip icon refs from app.json
        run: |
          node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("app.json","utf8"));delete a.expo.icon;delete a.expo.splash;delete a.expo.notification;if(a.expo.android)delete a.expo.android.adaptiveIcon;if(a.expo.web)delete a.expo.web.favicon;fs.writeFileSync("app.json",JSON.stringify(a,null,2));'

      - name: Inject Supabase keys into App.js
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node << 'EOF'
          const fs = require('fs');
          const url = (process.env.SB_URL || '').trim();
          const key = (process.env.SB_KEY || '').trim();
          if (!url.startsWith('https://')) {
            console.error('ERROR: Secret SUPABASE_URL is missing or does not start with https://');
            process.exit(1);
          }
          if (!key.startsWith('eyJ')) {
            console.error('ERROR: Secret SUPABASE_ANON_KEY is missing or is not the anon public key (must start with eyJ). NEVER use the service_role key.');
            process.exit(1);
          }
          let app = fs.readFileSync('App.js', 'utf8');
          const before = app;
          app = app.split("'PASTE_YOUR_PROJECT_URL_HERE'").join(JSON.stringify(url));
          app = app.split("'PASTE_YOUR_ANON_KEY_HERE'").join(JSON.stringify(key));
          if (app === before) {
            console.error('ERROR: Placeholders not found in App.js — repo App.js is wrong or already injected.');
            process.exit(1);
          }
          fs.writeFileSync('App.js', app);
          console.log('Supabase keys injected OK -> ' + url + ' (anon key length: ' + key.length + ')');
          EOF

      - name: Install packages
        run: npm install --legacy-peer-deps --no-audit --no-fund || npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Add polyfill + buffer
        run: npm install --save --legacy-peer-deps react-native-url-polyfill@2.0.0 buffer@6.0.3 || echo "polyfill install skipped"

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Bundle JS into APK
        run: npx expo export:embed --entry-file index.js --platform android --dev false --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Build APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pabili-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

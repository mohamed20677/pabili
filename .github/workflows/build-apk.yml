name: Build Pabili APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check secrets
        run: |
          echo "URL length: ${#SUPABASE_URL}"
          echo "KEY length: ${#SUPABASE_ANON_KEY}"
          if [ ${#SUPABASE_URL} -lt 30 ] || [ ${#SUPABASE_ANON_KEY} -lt 100 ]; then
            echo "❌ Secrets باهتين — ارجع وحدّثهم"
            exit 1
          fi
          echo "✅ Secrets تمام"

      - name: Inject keys into App.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node -e "
            const fs=require('fs');
            let a=fs.readFileSync('App.js','utf8');
            a=a.replace(/'PASTE_YOUR_PROJECT_URL_HERE'/g, JSON.stringify(process.env.SUPABASE_URL));
            a=a.replace(/'PASTE_YOUR_ANON_KEY_HERE'/g, JSON.stringify(process.env.SUPABASE_ANON_KEY));
            fs.writeFileSync('App.js', a);
            console.log('✅ Keys injected');
          "

      - name: Install
        run: npm install --legacy-peer-deps

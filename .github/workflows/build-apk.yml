name: Build Pabili APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Inject Supabase keys
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let s = fs.readFileSync('App.js', 'utf8');
            s = s.replace('PASTE_YOUR_PROJECT_URL_HERE', process.env.SUPABASE_URL);
            s = s.replace('PASTE_YOUR_ANON_KEY_HERE', process.env.SUPABASE_ANON_KEY);
            fs.writeFileSync('App.js', s);
            console.log('Injected OK');
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Create placeholder assets
        run: |
          mkdir -p assets
          node -e "const fs=require('fs');const b=Buffer.from('89504E470D0A1A0A0000000D49484452000000010000000108060000001F15C4890000000D49444154789C630001000000050001A5F645400000000049454E44AE426082','hex');for(const f of ['icon.png','adaptive-icon.png','splash.png','favicon.png','notification-icon.png'])fs.writeFileSync('assets/'+f,b);"

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Build APK
        run: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pabili-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

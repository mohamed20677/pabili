name: Build Pabili APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Validate Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "URL length: ${#SUPABASE_URL}"
          echo "KEY length: ${#SUPABASE_ANON_KEY}"
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: Secrets SUPABASE_URL or SUPABASE_ANON_KEY are empty"
            exit 1
          fi
          case "$SUPABASE_URL" in
            *PASTE*) echo "ERROR: SUPABASE_URL still has PASTE"; exit 1 ;;
            https://*) ;;
            *) echo "ERROR: must start with https://"; exit 1 ;;
          esac
          case "$SUPABASE_ANON_KEY" in
            *PASTE*) echo "ERROR: SUPABASE_ANON_KEY still has PASTE"; exit 1 ;;
            eyJ*) ;;
            *) echo "ERROR: must start with eyJ (JWT)"; exit 1 ;;
          esac
          echo "Both secrets validated OK"

      - name: Generate icons if missing
        run: |
          python3 -m pip install --quiet pillow 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages pillow 2>/dev/null \
            || python3 -m pip install --quiet --user pillow 2>/dev/null \
            || echo "PILLOW_UNAVAILABLE - using pure-python fallback"
          python3 << 'PYEOF'
          import os, zlib, struct

          BRAND = (14, 124, 91)  # #0E7C5B

          def chunk(tag, data):
              return (struct.pack('>I', len(data)) + tag + data
                      + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff))

          def write_solid_png(path, w, h, rgba):
              raw = b''.join(b'\x00' + bytes(rgba) * w for _ in range(h))
              png = (b'\x89PNG\r\n\x1a\n'
                     + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0))
                     + chunk(b'IDAT', zlib.compress(raw))
                     + chunk(b'IEND', b''))
              with open(path, 'wb') as f:
                  f.write(png)

          try:
              from PIL import Image, ImageDraw, ImageFont
              HAS_PIL = True
          except Exception:
              HAS_PIL = False

          def load_font(size):
              for p in ('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',
                        '/usr/share/fonts/truetype/freefont/FreeSansBold.ttf'):
                  try:
                      return ImageFont.truetype(p, size)
                  except Exception:
                      continue
              return ImageFont.load_default()

          def make_icon(path, size, transparent=False):
              if not HAS_PIL:
                  write_solid_png(path, size, size, (0, 0, 0, 0) if transparent else BRAND + (255,))
                  print('icon generated (fallback solid):', path)
                  return
              img = Image.new('RGBA', (size, size), (0, 0, 0, 0) if transparent else BRAND + (255,))
              d = ImageDraw.Draw(img)
              d.ellipse([size*0.14, size*0.14, size*0.86, size*0.86], fill=BRAND + (255,))
              f = load_font(int(size*0.5))
              try:
                  d.text((size//2, size//2), 'P', fill='white', anchor='mm', font=f)
              except Exception:
                  d.text((int(size*0.32), int(size*0.2)), 'P', fill='white', font=f)
              img.save(path)
              print('icon generated:', path)

          def make_splash(path, w, h):
              if not HAS_PIL:
                  write_solid_png(path, w, h, BRAND + (255,))
                  print('splash generated (fallback solid):', path)
                  return
              img = Image.new('RGB', (w, h), BRAND)
              d = ImageDraw.Draw(img)
              f = load_font(600)
              try:
                  d.text((w//2, h//2), 'P', fill='white', anchor='mm', font=f)
              except Exception:
                  d.text((int(w*0.42), int(h*0.44)), 'P', fill='white', font=f)
              img.save(path)
              print('splash generated:', path)

          os.makedirs('assets', exist_ok=True)
          make_icon('assets/icon.png', 1024)
          make_icon('assets/adaptive-icon.png', 1024, transparent=True)
          make_icon('assets/notification-icon.png', 96)
          make_icon('assets/favicon.png', 48)
          make_splash('assets/splash.png', 1242, 2436)
          print('ALL ICONS READY')
          PYEOF

      - name: Inject Supabase keys into App.js
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Repo root contents:"
          ls -la
          APP_FILE=""
          if [ -f "App.js" ]; then APP_FILE="App.js";
          elif [ -f "app.js" ]; then APP_FILE="app.js";
          elif [ -f "APP.JS" ]; then APP_FILE="APP.JS";
          fi
          if [ -z "$APP_FILE" ]; then
            echo "ERROR: App.js not found in repo root!"
            echo "FIX: Upload App.js to https://github.com/mohamed20677/pabili/upload/main then re-run this workflow."
            exit 1
          fi
          echo "Using entry file: $APP_FILE"
          export APP_FILE
          node << 'EOF'
          const fs = require('fs');
          const file = process.env.APP_FILE;
          const url = (process.env.SB_URL || '').trim();
          const key = (process.env.SB_KEY || '').trim();
          if (!url.startsWith('https://')) {
            console.error('ERROR: Secret SUPABASE_URL is missing or does not start with https://');
            process.exit(1);
          }
          if (!key.startsWith('eyJ')) {
            console.error('ERROR: Secret SUPABASE_ANON_KEY is missing or is not the anon public key (must start with eyJ). NEVER use the service_role key.');
            process.exit(1);
          }
          let app = fs.readFileSync(file, 'utf8');
          const before = app;
          app = app.split("'PASTE_YOUR_PROJECT_URL_HERE'").join(JSON.stringify(url));
          app = app.split("'PASTE_YOUR_ANON_KEY_HERE'").join(JSON.stringify(key));
          if (app === before) {
            console.error('ERROR: Placeholders not found in ' + file + ' — the file on GitHub is old or already injected. Re-upload the latest App.js.');
            process.exit(1);
          }
          fs.writeFileSync(file, app);
          console.log('Supabase keys injected OK into ' + file + ' -> ' + url + ' (anon key length: ' + key.length + ')');
          EOF

      - name: Install packages
        run: npm install --legacy-peer-deps --no-audit --no-fund || npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Add polyfill + buffer
        run: npm install --save --legacy-peer-deps react-native-url-polyfill@2.0.0 buffer@6.0.3 || echo "polyfill install skipped"

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Bundle JS into APK
        run: npx expo export:embed --entry-file index.js --platform android --dev false --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Build APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pabili-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build Pabili APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Inject Supabase keys
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const url = process.env.SUPABASE_URL || '';
            const key = process.env.SUPABASE_ANON_KEY || '';
            if (!url || url.includes('PASTE') || !key || key.includes('PASTE')) {
              throw new Error('Secrets SUPABASE_URL or SUPABASE_ANON_KEY missing or still PASTE!');
            }
            let app = fs.readFileSync('App.js', 'utf8');
            app = app
              .replace(/'PASTE_YOUR_PROJECT_URL_HERE'/g, JSON.stringify(url))
              .replace(/'PASTE_YOUR_ANON_KEY_HERE'/g, JSON.stringify(key));
            fs.writeFileSync('App.js', app);
            core.info('✅ Supabase keys injected into App.js');

      - name: Install npm packages
        run: npm install --legacy-peer-deps

      - name: Add polyfill + buffer
        run: npm install --save react-native-url-polyfill@2.0.0 buffer@6.0.3 --legacy-peer-deps

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - name: Bundle JS into APK
        run: npx expo export:embed --entry-file index.js --platform android --dev false --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Build APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pabili-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build Pabili APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Strip asset refs from app.json
        run: |
          node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync("app.json", "utf8"));
            delete a.expo.icon;
            delete a.expo.splash;
            delete a.expo.notification;
            if (a.expo.android) delete a.expo.android.adaptiveIcon;
            if (a.expo.web) delete a.expo.web.favicon;
            fs.writeFileSync("app.json", JSON.stringify(a, null, 2));
            console.log("✅ Asset refs removed");
          '

      - name: Inject Supabase keys
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node -e '
            const fs = require("fs");
            const url = process.env.SUPABASE_URL;
            const key = process.env.SUPABASE_ANON_KEY;
            if (!url || url.includes("PASTE") || !key || key.includes("PASTE")) {
              throw new Error("Secrets فاضية");
            }
            let app = fs.readFileSync("App.js", "utf8");
            app = app
              .replace(/'\''PASTE_YOUR_PROJECT_URL_HERE'\''/g, JSON.stringify(url))
              .replace(/'\''PASTE_YOUR_ANON_KEY_HERE'\''/g, JSON.stringify(key));
            fs.writeFileSync("App.js", app);
            console.log("✅ Keys injected");
          '

      - name: Install packages
        run: npm install --legacy-peer-deps

      - name: Add polyfill + buffer
        run: npm install --save react-native-url-polyfill@2.0.0 buffer@6.0.3 --legacy-peer-deps

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Bundle JS
        run: npx expo export:embed --entry-file index.js --platform android --dev false --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pabili-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

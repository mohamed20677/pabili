      - name: Inject Supabase keys
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let s = fs.readFileSync('App.js', 'utf8');
            s = s.replace('PASTE_YOUR_PROJECT_URL_HERE', process.env.SUPABASE_URL);
            s = s.replace('PASTE_YOUR_ANON_KEY_HERE', process.env.SUPABASE_ANON_KEY);
            fs.writeFileSync('App.js', s);
            console.log('Injected OK');
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

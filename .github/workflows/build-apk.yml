name: Build Pabili APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Inject Supabase keys
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const s = fs.readFileSync('App.js', 'utf8');
            const url = process.env.SUPABASE_URL || '';
            const key = process.env.SUPABASE_ANON_KEY || '';
            console.log('URL length:', url.length, 'Key length:', key.length);
            if (!url || !key) throw new Error('Secrets are empty!');
            let out = s.replace("'PASTE_YOUR_PROJECT_URL_HERE'", JSON.stringify(url));
            out = out.replace("'PASTE_YOUR_ANON_KEY_HERE'", JSON.stringify(key));
            if (out === s) throw new Error('Placeholders not found in App.js');
            fs.writeFileSync('App.js', out);
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Create index.js entry (registers 'main' + URL fix)
        run: |
          cat > index.js << 'EOF'
          // Make URL.protocol writable on the instance to avoid RN's read-only getter
          try {
            const Desc = Object.getOwnPropertyDescriptor(URL.prototype, 'protocol');
            if (Desc && !Desc.set) {
              Object.defineProperty(URL.prototype, 'protocol', {
                get: Desc.get,
                set: function(v) {
                  Object.defineProperty(this, 'protocol', { value: v, writable: true, configurable: true });
                },
                configurable: true,
              });
            }
          } catch (e) {}

          import { registerRootComponent } from 'expo';
          import App from './App';
          registerRootComponent(App);
          EOF

      - name: Set app.json main = index.js
        run: |
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            c.expo.main = 'index.js';
            fs.writeFileSync('app.json', JSON.stringify(c, null, 2));
            console.log('main =', c.expo.main);
          "

      - name: Patch app.json to remove asset requirements
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            if (cfg.expo) {
              delete cfg.expo.icon;
              if (cfg.expo.splash) delete cfg.expo.splash.image;
              if (cfg.expo.android && cfg.expo.android.adaptiveIcon) {
                delete cfg.expo.android.adaptiveIcon.foregroundImage;
                delete cfg.expo.android.adaptiveIcon.monochromeImage;
              }
              if (cfg.expo.notification) delete cfg.expo.notification.icon;
            }
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2));
          "

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Bundle JS into the APK
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed --entry-file index.js --platform android --dev false \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build APK
        run: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pabili-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
